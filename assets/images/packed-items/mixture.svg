<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="grad_🥣" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8A527;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#735c00;stop-opacity:0.9" />
    </linearGradient>
    <filter id="shadow_🥣">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#grad_🥣)"/>
  
  <!-- Decorative circles -->
  <circle cx="60" cy="40" r="45" fill="#fbf9f1" opacity="0.15"/>
  <circle cx="340" cy="260" r="55" fill="#fbf9f1" opacity="0.12"/>
  <circle cx="200" cy="150" r="70" fill="#fbf9f1" opacity="0.1" filter="url(#shadow_🥣)"/>
  
  <!-- Center content -->
  <text x="200" y="120" font-size="80" text-anchor="middle" fill="#fbf9f1" opacity="0.3">
    🥣
  </text>
  
  <!-- Product name -->
  <text x="200" y="210" font-size="24" font-weight="bold" text-anchor="middle" fill="#fbf9f1" font-family="Georgia, serif">
    Mixture
  </text>
  
  <!-- Brand -->
  <text x="200" y="245" font-size="12" text-anchor="middle" fill="#fbf9f1" font-family="Arial, sans-serif" opacity="0.8">
    Aramane Sweets
  </text>
  
  <!-- Quality indicator -->
  <rect x="20" y="20" width="360" height="260" rx="15" fill="none" stroke="#fbf9f1" stroke-width="2" opacity="0.5"/>
</svg>