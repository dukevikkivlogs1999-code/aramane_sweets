<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Aramane Sweets</title>
    <script>
        // Smart redirect for any 404 errors
        var path = window.location.pathname;
        if (path.includes('/aramane_sweets/')) {
            // GitHub Pages subdirectory
            window.location.href = '/aramane_sweets/pages/index.html';
        } else {
            // Local or root domain
            window.location.href = './pages/index.html';
        }
    </script>
</head>
<body>
    <p>Page not found. Redirecting to Aramane Sweets home page...</p>
    <p><a href="./pages/index.html">Click here if you are not redirected</a></p>
</body>
</html>
